# Build Windows Store packages + Mac App Store pkg, create a GitHub Release,
# and submit to Partner Center / App Store Connect.
#
# Trigger: Actions → "Release build" → Run workflow, or push tag v* (e.g. v2.7.8).
# Manual inputs:
#   create_github_release   — create GitHub Release from changelog.md (default: true)
#   submit_microsoft_store  — submit MSIX to Partner Center (default: true)
#   submit_mac_app_store    — submit MAS pkg to App Store Connect (default: true)
#   mas_build_number        — override CFBundleVersion (only to re-upload the
#                             same marketing version after a failed MAS run)
# Tag pushes always create a GitHub Release and submit to both stores.
#
# Before shipping: bump version, add ## vX.Y.Z to changelog.md per
# changelog-style.md (product headings + optional [macos]/[windows]/[linux]
# tags), commit to main.
# Store CI setup: docs/microsoft-store-ci.md, docs/mac-app-store-ci.md
#
# ── Windows Store package identity (same as local .env) ──
#   WINDOWS_IDENTITY_NAME
#   WINDOWS_PUBLISHER
#   WINDOWS_PUBLISHER_DISPLAY_NAME
#
# ── Microsoft Store Partner Center submit (see docs/microsoft-store-ci.md) ──
#   AZURE_AD_TENANT_ID
#   AZURE_AD_APPLICATION_CLIENT_ID
#   AZURE_AD_APPLICATION_SECRET
#   SELLER_ID
#   MS_STORE_PRODUCT_ID
#
# ── Mac App Store signing + App Store Connect (see docs/mac-app-store-ci.md) ──
#   MAC_APP_STORE_CERTIFICATE_BASE64            Apple Distribution .p12 (base64)
#   MAC_APP_STORE_CERTIFICATE_PASSWORD
#   MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64  3rd Party Mac Developer Installer .p12
#   MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD (optional; defaults to cert password)
#   MAC_APP_STORE_PROVISIONING_PROFILE_BASE64   MAS .provisionprofile (base64)
#   KEYCHAIN_PASSWORD
#   APPLE_APP_IDENTITY                          "Apple Distribution: … (TEAMID)"
#   APPLE_INSTALLER_IDENTITY                    "3rd Party Mac Developer Installer: …"
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_P8                base64 of AuthKey_*.p8
#
# Reuse the same Entra app as Digital Habits: Blocker if it already has Manager on the
# Partner Center account — only MS_STORE_PRODUCT_ID must be To-Do’s Store ID.
# Repo: ulyngs/digital-habits-to-do (git remote may still say redd-task; that redirects).

name: Release build

on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: Create a GitHub Release (notes from changelog.md)
        type: boolean
        default: true
      submit_microsoft_store:
        description: Submit Microsoft Store MSIX to Partner Center (What's new from changelog)
        type: boolean
        default: true
      submit_mac_app_store:
        description: Submit Mac App Store pkg to App Store Connect (What's new from changelog)
        type: boolean
        default: true
      mas_build_number:
        description: Override MAS CFBundleVersion (only to re-upload the same version)
        type: string
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build-windows-store:
    name: Windows Store (.msix)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Microsoft Store packages
        shell: pwsh
        env:
          WINDOWS_IDENTITY_NAME: ${{ secrets.WINDOWS_IDENTITY_NAME }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_PUBLISHER_DISPLAY_NAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run build:win-store

      - name: Upload Windows Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-packages
          path: |
            for-distribution/x86_64-pc-windows-msvc/*.msix
            for-distribution/x86_64-pc-windows-msvc/nsis/**
            for-distribution/x86_64-pc-windows-msvc/msi/**
          if-no-files-found: error
          retention-days: 30

  build-mac-app-store:
    name: Mac App Store (.pkg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Require Mac App Store signing secrets
        env:
          MAC_APP_STORE_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_CERTIFICATE_PASSWORD }}
          MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          missing=()
          for name in \
            MAC_APP_STORE_CERTIFICATE_BASE64 \
            MAC_APP_STORE_CERTIFICATE_PASSWORD \
            MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64 \
            MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 \
            KEYCHAIN_PASSWORD \
            APPLE_APP_IDENTITY \
            APPLE_INSTALLER_IDENTITY
          do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for Mac App Store signing: ${missing[*]}. See docs/mac-app-store-ci.md." >&2
            exit 1
          fi

      - name: Import Mac App Store certificates
        env:
          MAC_APP_STORE_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_CERTIFICATE_PASSWORD }}
          MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: bash ./scripts/import-mas-certs-for-ci.sh

      - name: Build Mac App Store package
        env:
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MAS_BUILD_NUMBER: ${{ inputs.mas_build_number || '' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${KEYCHAIN_PATH:?KEYCHAIN_PATH missing — import step must run first}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed -E 's/^ *"//;s/"$//' | tr '\n' ' ')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Codesigning identities before build:mas:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          npm run build:mas

      - name: Stage versioned pkg
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test -f for-distribution/Digital-Habits-To-Do.pkg
          mv for-distribution/Digital-Habits-To-Do.pkg "for-distribution/Digital-Habits-To-Do_${VERSION}.pkg"
          pkgutil --check-signature "for-distribution/Digital-Habits-To-Do_${VERSION}.pkg" || true
          ls -la for-distribution/

      - name: Upload Mac App Store artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-store-pkg
          path: for-distribution/Digital-Habits-To-Do_*.pkg
          if-no-files-found: error
          retention-days: 30

  publish-microsoft-store:
    name: Publish (Microsoft Store)
    needs: [build-windows-store]
    runs-on: windows-latest
    timeout-minutes: 60
    if: >-
      needs.build-windows-store.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.submit_microsoft_store)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require Partner Center secrets
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          $missing = @()
          foreach ($name in @(
            'AZURE_AD_TENANT_ID',
            'AZURE_AD_APPLICATION_CLIENT_ID',
            'AZURE_AD_APPLICATION_SECRET',
            'SELLER_ID',
            'MS_STORE_PRODUCT_ID'
          )) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { continue }
            $missing += $name
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub secrets for Store submit: $($missing -join ', '). See docs/microsoft-store-ci.md — set these once, or uncheck submit_microsoft_store on manual runs."
          }

      - name: Download Windows Store artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-store-packages
          path: store-packages

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog
        shell: bash
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform windows --out whats_new.txt
          echo "=== What's new ==="
          cat whats_new.txt

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Submit to Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          PYTHONUTF8: '1'
        run: |
          ./scripts/submit-microsoft-store.ps1 `
            -PackagesDir store-packages `
            -WhatsNewFile whats_new.txt `
            -ProductId $env:MS_STORE_PRODUCT_ID `
            -Reconfigure

  # App Store Connect submit — independent of GitHub Release / Microsoft Store.
  publish-mac-app-store:
    name: Publish (Mac App Store)
    needs: [build-mac-app-store]
    runs-on: macos-latest
    timeout-minutes: 120
    if: >-
      needs.build-mac-app-store.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.submit_mac_app_store)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for Mac App Store submit: ${missing[*]}. See docs/mac-app-store-ci.md — set these once, or uncheck submit_mac_app_store on manual runs." >&2
            exit 1
          fi

      - name: Download Mac App Store artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-app-store-pkg
          path: store-packages-mas

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog (macOS)
        id: notes
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform macos --empty-ok --out whats_new_mas.txt
          if [[ -s whats_new_mas.txt ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "=== What's new (macOS) ==="
            cat whats_new_mas.txt
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No macOS-facing changelog bullets for v${{ steps.meta.outputs.version }} — skipping Mac App Store submission."
          fi

      - name: Submit to App Store Connect
        if: steps.notes.outputs.has_notes == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_PRIMARY_LOCALE: ${{ secrets.ASC_PRIMARY_LOCALE }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          PKG="$(find store-packages-mas -type f -name '*.pkg' | head -1)"
          if [[ -z "$PKG" ]]; then
            echo "No .pkg found in store-packages-mas" >&2
            exit 1
          fi
          fastlane mac submit_mac_app_store \
            "version:${{ steps.meta.outputs.version }}" \
            "pkg:${PKG}" \
            "notes:whats_new_mas.txt"

  publish-github-release:
    name: Publish (GitHub Release)
    needs: [build-windows-store, build-mac-app-store]
    runs-on: ubuntu-latest
    if: >-
      needs.build-windows-store.result == 'success' &&
      needs.build-mac-app-store.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-store-packages
          path: artifacts/windows

      - name: Download Mac App Store artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-app-store-pkg
          path: artifacts/mas

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p for-distribution
          find artifacts/windows -type f \( -name '*.msix' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp -n {} for-distribution/ \;
          find artifacts/mas -type f -name '*.pkg' -exec cp -n {} for-distribution/ \;
          echo "Staged:"
          ls -la for-distribution

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        run: |
          bash ./scripts/extract-changelog-section.sh "${{ steps.meta.outputs.version }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Digital Habits: To-Do v${{ steps.meta.outputs.version }}"
          body_path: release-notes.md
          files: |
            for-distribution/Digital-Habits-To-Do_*.msix
            for-distribution/Digital-Habits-To-Do_*.pkg
            for-distribution/*.exe
            for-distribution/*.msi
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: false
