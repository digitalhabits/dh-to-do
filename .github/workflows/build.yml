# Build Digital Habits: To-Do for the two stores, from this public source.
#
# This file is written into the public repository by the export script
# (scripts/export-todo-mirror.mjs in the private monorepo). Edit it there, in
# apps/todo/mirror/workflows/build.yml. A change made here is lost at the next
# export.
#
# To-Do goes out through the Mac App Store and the Microsoft Store only. So a
# run makes two store packages and no direct download:
#
#   mac           a universal .pkg for App Store Connect, signed with the App
#                 Store identities, sandboxed, with the provisioning profile
#                 inside. `pnpm --dir apps/todo app:build:mas`.
#   windows       one .msix for each architecture, for Partner Center. Not
#                 signed: Microsoft signs it again when it takes it in.
#                 `pnpm --dir apps/todo app:build:win-store`.
#   release       a DRAFT release "v<version>" with both packages, their
#                 checksums, and the notes from changelog.md. A person reads
#                 it and publishes it.
#   submit-mac    optional. Sends the .pkg to App Store Connect with the
#                 What's New text from changelog.md, and submits for review.
#   submit-windows  optional. The same for Partner Center.
#
# Each package gets a build provenance attestation. Anybody can check that a
# file was built here, from this commit:
#
#   gh attestation verify <file> --repo digitalhabits/dh-to-do
#
# Trigger: Actions -> "Build" -> Run workflow. There is no other trigger, and
# there must never be one. A run on a pull request would build a stranger's
# code with the signing secrets in reach. 2.x also ran on a pushed tag; this
# does not, because a snapshot push must never send anything to a store.
#
# Two environments, each with a required reviewer, so each step that can read
# a secret waits for an approval:
#
#   "release"       the build jobs. Signing only.
#     MAC_APP_STORE_CERTIFICATE_BASE64, MAC_APP_STORE_CERTIFICATE_PASSWORD
#         the "Apple Distribution" .p12
#     MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64, MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD
#         the "3rd Party Mac Developer Installer" .p12
#     MAC_APP_STORE_PROVISIONING_PROFILE_BASE64
#         the App Store profile for com.redd.do
#     APPLE_APP_IDENTITY, APPLE_INSTALLER_IDENTITY
#         the two identity names, as `security find-identity` prints them
#     KEYCHAIN_PASSWORD
#         any long random value; it locks the keychain made for the run
#     The Windows build needs no secret.
#
#   "store-submit"  the two submit jobs. They can put a version in front of
#                   every user, so they have their own approval.
#     APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID,
#     APP_STORE_CONNECT_API_KEY_P8, ASC_PRIMARY_LOCALE (optional, en-GB)
#     AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID,
#     AZURE_AD_APPLICATION_SECRET, SELLER_ID, MS_STORE_PRODUCT_ID
#
# Each action is pinned to a commit, with its version beside it. A tag can be
# moved to other code. A commit cannot.

name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        type: choice
        default: both
        options: [both, mac, windows]
      windows_architecture:
        description: "Windows architectures"
        type: choice
        default: both
        options: [both, x64, arm64]
      draft_release:
        description: "Put the packages in a draft release"
        type: boolean
        default: true
      submit_mac_app_store:
        description: "Send the .pkg to App Store Connect and submit for review"
        type: boolean
        default: false
      submit_microsoft_store:
        description: "Send the .msix to Partner Center and submit for certification"
        type: boolean
        default: false
      upload_mac_screenshots:
        description: "With the Mac submission, replace the store pictures with store-listing/screenshots/mac/en"
        type: boolean
        default: false
      mas_build_number:
        description: "Mac build number, only to send the same version again"
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true

jobs:
  mac:
    name: Mac App Store (.pkg)
    if: inputs.platform == 'both' || inputs.platform == 'mac'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/todo/src-tauri/target
          key: cargo-mas-${{ hashFiles('apps/todo/src-tauri/Cargo.lock') }}
          restore-keys: cargo-mas-

      - name: Install
        run: pnpm install --frozen-lockfile

      # A package that App Store Connect will refuse is not worth the run.
      # Stop before the compile, not after it.
      - name: Check the secrets
        env:
          MAC_APP_STORE_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_CERTIFICATE_PASSWORD }}
          MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          missing=""
          for name in MAC_APP_STORE_CERTIFICATE_BASE64 MAC_APP_STORE_CERTIFICATE_PASSWORD \
                      MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64 MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 \
                      KEYCHAIN_PASSWORD APPLE_APP_IDENTITY APPLE_INSTALLER_IDENTITY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing from the environment \"release\":$missing"
            exit 1
          fi

      # A keychain of its own for this run, with the two certificates in it,
      # and the provisioning profile written to a file. The script puts
      # KEYCHAIN_PATH and APPLE_PROVISIONING_PROFILE_PATH in the environment
      # of the later steps.
      - name: Import the App Store certificates
        env:
          MAC_APP_STORE_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_CERTIFICATE_PASSWORD }}
          MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_BASE64 }}
          MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAC_APP_STORE_INSTALLER_CERTIFICATE_PASSWORD }}
          MAC_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_APP_IDENTITY: ${{ secrets.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: bash apps/todo/scripts/import-mas-certs-for-ci.sh

      - name: Read the version
        id: version
        run: node -p "'version=' + require('./apps/todo/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MAS_BUILD_NUMBER: ${{ inputs.mas_build_number }}
        run: pnpm --dir apps/todo app:build:mas

      # The version in the name, and a checksum with the file name only, for
      # a reader who checks a file in their Downloads folder.
      - name: Name the package
        working-directory: apps/todo/for-distribution
        run: |
          pkg="Digital-Habits-To-Do_${{ steps.version.outputs.version }}.pkg"
          mv Digital-Habits-To-Do.pkg "$pkg"
          pkgutil --check-signature "$pkg"
          shasum -a 256 "$pkg" > "$pkg.sha256"

      - name: Say what was built
        working-directory: apps/todo/for-distribution
        run: |
          {
            echo "## Digital Habits To-Do ${{ steps.version.outputs.version }} — Mac App Store"
            echo
            for file in *.pkg; do
              echo "- \`$file\` — $(du -h "$file" | cut -f1)"
              echo "  \`$(cut -d' ' -f1 "$file.sha256")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest where the package came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/todo/for-distribution/*.pkg

      - name: Keep the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: todo-mac-${{ steps.version.outputs.version }}
          path: |
            apps/todo/for-distribution/*.pkg
            apps/todo/for-distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Microsoft Store (.msix)
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    # No secret is read here. The environment is for the approval: a build
    # that ends in a release should be one that a person asked for.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/todo/src-tauri/target
          key: cargo-windows-${{ hashFiles('apps/todo/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Read the version
        id: version
        shell: bash
        run: node -p "'version=' + require('./apps/todo/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Package
        working-directory: apps/todo
        shell: pwsh
        run: |
          switch ('${{ inputs.windows_architecture }}') {
            'x64'   { pnpm app:build:win-store -x64Only }
            'arm64' { pnpm app:build:win-store -arm64Only }
            default { pnpm app:build:win-store }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Write the checksums and say what was packaged
        shell: pwsh
        run: |
          $lines = @("## Digital Habits To-Do ${{ steps.version.outputs.version }} — Microsoft Store", '')
          foreach ($file in Get-ChildItem 'apps/todo/for-distribution/*.msix') {
            $digest = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($file.Name)" | Set-Content -NoNewline -Encoding ascii "$($file.FullName).sha256"
            $mb = [math]::Round($file.Length / 1MB, 1)
            $lines += "- ``$($file.Name)`` — $mb MB"
            $lines += "  `n  ``$digest``"
          }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Attest where the packages came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/todo/for-distribution/*.msix

      - name: Keep the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: todo-windows-${{ steps.version.outputs.version }}
          path: |
            apps/todo/for-distribution/*.msix
            apps/todo/for-distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

  # A draft, and only a draft. It has no public page until a person publishes
  # it. A run for the same version puts the new files over the old ones. The
  # packages are not for installing by hand: they are here so the public record
  # holds the exact files that went to the stores.
  release:
    needs: [mac, windows]
    if: ${{ !cancelled() && !failure() && inputs.draft_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.mac.outputs.version || needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: todo-*
          path: files
          merge-multiple: true

      - name: Put the packages in a draft release
        run: |
          ls -l files
          tag="v$VERSION"
          bash apps/todo/scripts/extract-changelog-section.sh "$VERSION" apps/todo/changelog.md > notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $tag is published. This run does not change a published release. Bump the version."
              exit 1
            fi
            gh release upload "$tag" files/* --clobber
          else
            gh release create "$tag" files/* \
              --draft \
              --target "${{ github.sha }}" \
              --title "Digital Habits: To-Do $VERSION" \
              --notes-file notes.md
          fi

  submit-mac:
    name: Submit (Mac App Store)
    needs: [mac]
    if: ${{ !cancelled() && needs.mac.result == 'success' && inputs.submit_mac_app_store }}
    runs-on: macos-latest
    timeout-minutes: 60
    environment: store-submit
    env:
      VERSION: ${{ needs.mac.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check the secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=""
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing from the environment \"store-submit\":$missing"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: todo-mac-${{ needs.mac.outputs.version }}
          path: apps/todo/store-packages-mas

      # A version with no line that a Mac user would see gets no submission:
      # the store asks what is new, and "nothing" is not an answer to send.
      - name: Build What's New from the changelog
        id: notes
        working-directory: apps/todo
        run: |
          node scripts/changelog-to-store-whats-new.cjs "$VERSION" changelog.md --platform macos --empty-ok --out whats_new_mas.txt
          if [ -s whats_new_mas.txt ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            cat whats_new_mas.txt
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No line for macOS in the changelog for v$VERSION. Nothing is sent to the Mac App Store."
          fi

      - name: Submit to App Store Connect
        if: steps.notes.outputs.has_notes == 'true'
        working-directory: apps/todo
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_PRIMARY_LOCALE: ${{ secrets.ASC_PRIMARY_LOCALE }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: |
          pkg="$(find store-packages-mas -type f -name '*.pkg' | head -1)"
          if [ -z "$pkg" ]; then
            echo "::error::No .pkg in the artifact of the mac job."
            exit 1
          fi
          fastlane mac submit_mac_app_store "version:$VERSION" "pkg:$pkg" "notes:whats_new_mas.txt" "screenshots:${{ inputs.upload_mac_screenshots }}"

  submit-windows:
    name: Submit (Microsoft Store)
    needs: [windows]
    if: ${{ !cancelled() && needs.windows.result == 'success' && inputs.submit_microsoft_store }}
    runs-on: windows-latest
    timeout-minutes: 60
    environment: store-submit
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check the secrets
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          missing=""
          for name in AZURE_AD_TENANT_ID AZURE_AD_APPLICATION_CLIENT_ID AZURE_AD_APPLICATION_SECRET SELLER_ID MS_STORE_PRODUCT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing from the environment \"store-submit\":$missing"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: todo-windows-${{ needs.windows.outputs.version }}
          path: apps/todo/store-packages

      - name: Build What's New from the changelog
        working-directory: apps/todo
        shell: bash
        run: |
          node scripts/changelog-to-store-whats-new.cjs "$VERSION" changelog.md --platform windows --out whats_new.txt
          cat whats_new.txt

      - name: Set up the Microsoft Store command line tool
        uses: microsoft/microsoft-store-apppublisher@b76227f539d68e6465f79bbbc82ed92f61081aa4 # v1.3

      - name: Submit to Partner Center
        working-directory: apps/todo
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          PYTHONUTF8: "1"
        run: |
          ./scripts/submit-microsoft-store.ps1 `
            -PackagesDir store-packages `
            -WhatsNewFile whats_new.txt `
            -ProductId $env:MS_STORE_PRODUCT_ID `
            -Reconfigure
