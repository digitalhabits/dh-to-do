[package]
name = "digital-habits-todo"
version = "3.4.0"
description = "Digital Habits: To-Do — standalone Mac, Windows and Linux app (SQLite via Tauri)"
authors = ["Digital Habits"]
license = ""
repository = "https://github.com/digitalhabits/dh-to-do"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
urlencoding = "2.1"
url = "2"
tiny_http = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tauri-plugin-deep-link = "2"
# The Google sign-in (google.rs): PKCE needs a hash and random bytes.
sha2 = "0.11"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"

# The focus window's rounded corners on Windows 11 (focus.rs). Same version
# as Tauri's, so the window handle types match.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

# The AppImage updates itself (linux_update.rs). The stores update the
# Mac and Windows apps.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKReminder", "EKCalendar", "EKCalendarItem", "EKSource"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSCalendar", "NSDate", "NSError", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
# The system rating sheet (review.rs).
objc2-store-kit = { version = "0.3", default-features = false, features = ["std", "SKStoreReviewController"] }
# To see if the sheet came: the list of windows on screen (review.rs).
core-graphics = "0.25"
core-foundation = "0.10"

# The Google refresh token is kept in the system's credential store
# (google.rs). Linux has no one store on every desktop, and keeps a file
# that only its user can read.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
